apiVersion: mgmt/v1alpha1
kind: CompetencyFramework
metadata:
  name: eng
spec:
  levels: [IC2, IC3]            # ordered ladder, lowest first
  competencies:
    - id: delivery.ownership
      title: Owns outcomes end to end
      tokens: [ownership, own]
      levels:
        IC2: Sees their own tasks through to done and raises blockers early.
        IC3: Owns a whole piece of work from idea to follow-up without being chased.
    - id: collab.planning
      title: Contributes actively to planning and refinement
      tokens: [planning, plan]
      levels:
        IC3: Shapes the plan for their area, sizing work and naming risks up front.
    - id: scope.crossteam
      title: Delivers work that spans teams
      tokens: [crossteam, xteam]
      levels:
        IC3: Delivers changes that need agreement and work from more than one team.
